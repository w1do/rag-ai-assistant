server {
    listen 80;
    listen [::]:80;
    server_name botsync.ru;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    # ==========================================
    # 1. Статика Astro (CSS, JS, картинки)
    # ==========================================
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|ttf|woff|woff2|json|xml|txt)$ {
        # Пробуем сначала в Astro
        proxy_pass http://service-botsync-web-yejqlx:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==========================================
    # 2. Статика Laravel (Vite)
    # ==========================================
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;

        # Это для Laravel (если Vite билдит в Laravel)
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ==========================================
    # 3. API, админка, виджеты - на Laravel
    # ==========================================
    location ~* ^/(api|admin|dashboard|share-chat) {
        proxy_pass http://service-botsync-uxvoqm:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Inertia true;
    }

    # ==========================================
    # 4. ВСЁ ОСТАЛЬНОЕ - на Laravel (главная, тарифы и т.д.)
    # ==========================================
    location / {
        proxy_pass http://service-botsync-uxvoqm:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Inertia true;
    }

    # ==========================================
    # 5. PHP обработка (если Laravel через PHP-FPM)
    # ==========================================
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # ==========================================
    # 6. Стандартные файлы
    # ==========================================
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ==========================================
    # 7. Безопасность
    # ==========================================
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ==========================================
    # 8. Gzip
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
