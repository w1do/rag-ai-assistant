server {
    listen 80;
    listen [::]:80;
    server_name botsync.ru;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    # ==========================================
    # 1. СТАТИКА (Сначала Laravel public, потом Astro)
    # ==========================================
    location /_astro/ {
        proxy_pass http://service-botsync-web-yejqlx:4321;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|ttf|woff|woff2|json|xml|txt)$ {
        # Если файл есть в public Laravel (напр. widget.js, Vite build), отдаем его
        try_files $uri @astro_static;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location @astro_static {
        proxy_pass http://service-botsync-web-yejqlx:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # 2. ОСНОВНАЯ ЛОГИКА (Laravel -> Astro)
    # ==========================================
    location / {
        proxy_pass http://service-botsync-uxvoqm:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Если Laravel вернул 404, пробуем Astro (лендинг, SEO-страницы)
        proxy_intercept_errors on;
        error_page 404 = @fallback_to_astro;
    }

    location @fallback_to_astro {
        # Если это API или Inertia запрос, не идем в Astro, возвращаем 404 от бекенда
        if ($http_x_inertia) { return 404; }
        if ($http_x_requested_with = "XMLHttpRequest") { return 404; }
        if ($http_accept ~* "application/json") { return 404; }

        proxy_pass http://service-botsync-web-yejqlx:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. PHP обработка (если нужно)
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Стандартные файлы
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
