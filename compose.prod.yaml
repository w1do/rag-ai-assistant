services:
    app-botsync:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                CACHEBUST: ${CACHEBUST:-1}
        image: rag-system:latest
        restart: unless-stopped
        expose:
            - '80'
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.botsync.rule=Host(`lk.botsync.ru`)'
            - 'traefik.http.routers.botsync.entrypoints=websecure'
            - 'traefik.http.routers.botsync.tls.certresolver=letsencrypt'
            - 'traefik.http.services.botsync.loadbalancer.server.port=80'
        environment:
            APP_ENV: production
            APP_DEBUG: false
            APP_KEY: '${APP_KEY}'
            APP_URL: '${APP_URL}'
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            REDIS_HOST: redis
            REDIS_PORT: 6379
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            QDRANT_HOST: '${QDRANT_HOST:-qdrant}'
            QDRANT_PORT: '${QDRANT_PORT:-6333}'
        volumes:
            - 'app-storage:/var/www/html/storage/app'
            - 'app-logs:/var/www/html/storage/logs'
        networks:
            - app
            - traefik-public

networks:
    app:
        driver: bridge
    traefik-public:
        external: true
        name: dokploy-network

volumes:
    app-storage:
        driver: local
    app-logs:
        driver: local
